services:
  college-faqs:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:3002:3002"

    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3002
      # Server-only runtime settings. A host .env is interpolation input, not
      # container environment; require both explicitly before starting Compose.
      DATABASE_URL: ${DATABASE_URL:?Set the server-only DATABASE_URL}
      SUBMISSIONS_ORIGIN: ${SUBMISSIONS_ORIGIN:?Set the public browser origin}

    restart: unless-stopped
    init: true

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/api/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
